services:
  db:
    image: postgres:16
    restart: always

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .

    depends_on:
      - db

    env_file:
      - .env.docker

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:***@db:5432/league_analyzer

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    command:
      sh -c "alembic upgrade head && uvicorn analyzer.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: